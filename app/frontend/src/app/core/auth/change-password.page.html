<main class="login-page">
  <section class="login-frame" aria-labelledby="change-password-title">
    <header class="product-header">
      <div class="brand-lockup" aria-label="Neko Đoàn">
        <img
          src="brand/neko-doan-v1/neko-doan-mark.svg"
          width="40"
          height="40"
          alt=""
          aria-hidden="true"
        />
        <strong>Neko Đoàn</strong>
      </div>
      <span class="portal-label">{{ portalLabel }}</span>
    </header>

    <div class="login-card change-password-card">
      <img
        class="login-mark"
        src="brand/neko-doan-v1/neko-doan-mark.svg"
        width="64"
        height="64"
        alt=""
        aria-hidden="true"
      />
      <h1 id="change-password-title">Đổi mật khẩu lần đầu</h1>
      <p class="intro">Tạo mật khẩu riêng trước khi vào không gian làm việc.</p>

      <form class="auth-form" (ngSubmit)="submit()" [attr.aria-busy]="submitting()">
        <div class="field">
          <label for="current-password">Mật khẩu khởi tạo</label>
          <div class="password-control">
            <input
              #currentPasswordInput
              id="current-password"
              name="currentPassword"
              [type]="showCurrentPassword() ? 'text' : 'password'"
              autocomplete="current-password"
              maxlength="72"
              placeholder="Nhập mật khẩu khởi tạo"
              [(ngModel)]="currentPassword"
              [disabled]="busy()"
              [attr.aria-invalid]="errorField() === 'current' ? 'true' : null"
              [attr.aria-describedby]="errorField() === 'current' ? 'change-password-error' : null"
              required
              autofocus
            />
            <button
              class="field-icon-button"
              type="button"
              [attr.aria-pressed]="showCurrentPassword()"
              [attr.aria-label]="
                showCurrentPassword() ? 'Ẩn mật khẩu khởi tạo' : 'Hiện mật khẩu khởi tạo'
              "
              [attr.title]="
                showCurrentPassword() ? 'Ẩn mật khẩu khởi tạo' : 'Hiện mật khẩu khởi tạo'
              "
              aria-controls="current-password"
              [disabled]="busy()"
              (click)="showCurrentPassword.set(!showCurrentPassword())"
            >
              <img
                [src]="passwordIcon(showCurrentPassword())"
                width="20"
                height="20"
                alt=""
                aria-hidden="true"
              />
            </button>
          </div>
        </div>

        <div class="field">
          <label for="new-password">Mật khẩu mới</label>
          <div class="password-control">
            <input
              #newPasswordInput
              id="new-password"
              name="newPassword"
              [type]="showNewPassword() ? 'text' : 'password'"
              autocomplete="new-password"
              minlength="15"
              maxlength="72"
              placeholder="Nhập mật khẩu mới"
              [(ngModel)]="newPassword"
              [disabled]="busy()"
              [attr.aria-invalid]="errorField() === 'new' ? 'true' : null"
              [attr.aria-describedby]="
                errorField() === 'new' ? 'password-policy change-password-error' : 'password-policy'
              "
              required
            />
            <button
              class="field-icon-button"
              type="button"
              [attr.aria-pressed]="showNewPassword()"
              [attr.aria-label]="showNewPassword() ? 'Ẩn mật khẩu mới' : 'Hiện mật khẩu mới'"
              [attr.title]="showNewPassword() ? 'Ẩn mật khẩu mới' : 'Hiện mật khẩu mới'"
              aria-controls="new-password"
              [disabled]="busy()"
              (click)="showNewPassword.set(!showNewPassword())"
            >
              <img
                [src]="passwordIcon(showNewPassword())"
                width="20"
                height="20"
                alt=""
                aria-hidden="true"
              />
            </button>
          </div>
          <p id="password-policy" class="field-help">15–72 ký tự · Không trùng mật khẩu khởi tạo</p>
        </div>

        <div class="field">
          <label for="password-confirmation">Nhập lại mật khẩu mới</label>
          <div class="password-control">
            <input
              #confirmationInput
              id="password-confirmation"
              name="confirmation"
              [type]="showConfirmation() ? 'text' : 'password'"
              autocomplete="new-password"
              minlength="15"
              maxlength="72"
              placeholder="Nhập lại mật khẩu mới"
              [(ngModel)]="confirmation"
              [disabled]="busy()"
              [attr.aria-invalid]="errorField() === 'confirmation' ? 'true' : null"
              [attr.aria-describedby]="
                errorField() === 'confirmation' ? 'change-password-error' : null
              "
              required
            />
            <button
              class="field-icon-button"
              type="button"
              [attr.aria-pressed]="showConfirmation()"
              [attr.aria-label]="
                showConfirmation() ? 'Ẩn mật khẩu nhập lại' : 'Hiện mật khẩu nhập lại'
              "
              [attr.title]="showConfirmation() ? 'Ẩn mật khẩu nhập lại' : 'Hiện mật khẩu nhập lại'"
              aria-controls="password-confirmation"
              [disabled]="busy()"
              (click)="showConfirmation.set(!showConfirmation())"
            >
              <img
                [src]="passwordIcon(showConfirmation())"
                width="20"
                height="20"
                alt=""
                aria-hidden="true"
              />
            </button>
          </div>
        </div>

        @if (error()) {
          <p id="change-password-error" class="form-error" role="alert">{{ error() }}</p>
        }

        <div class="auth-actions">
          <button
            class="primary-action"
            type="submit"
            [disabled]="busy() || !currentPassword || !newPassword || !confirmation"
          >
            {{ submitting() ? 'Đang cập nhật…' : 'Đổi mật khẩu và tiếp tục' }}
          </button>
          <button class="secondary-action" type="button" [disabled]="busy()" (click)="logout()">
            {{ loggingOut() ? 'Đang đăng xuất…' : 'Đăng xuất tài khoản này' }}
          </button>
        </div>
      </form>
    </div>

    <footer class="security-note">
      <span>Thành đoàn Hải Phòng</span>
      <span aria-hidden="true">·</span>
      <span>Chưa đổi mật khẩu thì chưa thể truy cập dữ liệu</span>
    </footer>
  </section>
</main>
