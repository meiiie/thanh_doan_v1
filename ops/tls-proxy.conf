limit_req_zone $binary_remote_addr zone=tls_edge:10m rate=120r/m;

upstream campaign_frontend {
  server frontend:8080;
  keepalive 16;
}

server {
  listen 8443 ssl;
  server_name localhost 127.0.0.1;
  server_tokens off;

  ssl_certificate /run/secrets/tls.crt;
  ssl_certificate_key /run/secrets/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 10m;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location / {
    limit_req zone=tls_edge burst=60 nodelay;
    proxy_pass http://campaign_frontend;
    proxy_hide_header Strict-Transport-Security;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
