services:
  database:
    environment: !override
      POSTGRES_DB: ${POSTGRES_DB:-campaign}
      POSTGRES_USER: ${POSTGRES_USER:-campaign}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    secrets:
      - source: database_password
        target: POSTGRES_PASSWORD

  backend:
    environment: !override
      SPRING_PROFILES_ACTIVE: prod
      CAMPAIGN_DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB:-campaign}
      CAMPAIGN_DB_USER: ${POSTGRES_USER:-campaign}
      SPRING_CONFIG_IMPORT: optional:configtree:/run/secrets/
      APP_BOOTSTRAP_ENABLED: ${APP_BOOTSTRAP_ENABLED:-false}
      APP_BOOTSTRAP_USERNAME: ${APP_BOOTSTRAP_USERNAME:-superadmin}
      APP_BOOTSTRAP_DISPLAY_NAME: ${APP_BOOTSTRAP_DISPLAY_NAME:-Quản trị hệ thống}
      APP_SESSION_COOKIE_SECURE: "true"
    secrets:
      - source: database_password
        target: CAMPAIGN_DB_PASSWORD
      - source: bootstrap_password
        target: APP_BOOTSTRAP_PASSWORD

  frontend:
    ports: !reset []

  tls-proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TLS_APP_PORT:-4319}:8443"
    volumes:
      - ./ops/tls-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    secrets:
      - source: tls_certificate
        target: tls.crt
      - source: tls_private_key
        target: tls.key
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O - https://127.0.0.1:8443/healthz | grep -q '^ok$'"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,size=16m
    restart: unless-stopped
    networks: [edge]
    security_opt: ["no-new-privileges:true"]

secrets:
  database_password:
    file: ./.tmp/secrets/POSTGRES_PASSWORD
  bootstrap_password:
    file: ./.tmp/secrets/APP_BOOTSTRAP_PASSWORD
  tls_certificate:
    file: ./.tmp/secrets/tls.crt
  tls_private_key:
    file: ./.tmp/secrets/tls.key
