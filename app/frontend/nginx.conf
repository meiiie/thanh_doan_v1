limit_req_zone $binary_remote_addr zone=login_per_ip:10m rate=30r/m;

map $http_x_forwarded_proto $campaign_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

upstream campaign_backend {
  server backend:8081;
  keepalive 16;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 2m;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Angular autoCsp owns script-src with build-time hashes; this header adds the
  # remaining browser boundaries without intersecting away those hashes.
  add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location = /api/auth/login {
    limit_req zone=login_per_ip burst=10 nodelay;
    proxy_pass http://campaign_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $campaign_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
  }

  location /api/ {
    proxy_pass http://campaign_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $campaign_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Permissions-Policy;
  }

  location = /index.html {
    expires -1;
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|webp|ico|woff2)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
