openapi: 3.1.0
info:
  title: Neko Đoàn API
  version: 0.6.0-local
  description: Contract cho luồng phân công, tự chấm, thẩm định, giải trình và chốt kết quả.
servers:
  - url: https://127.0.0.1:4319
    description: Local TLS profile
security:
  - sessionCookie: []
paths:
  /api/auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Khởi tạo CSRF cookie cho SPA
      security: []
      responses:
        '200':
          description: CSRF token sẵn sàng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }
        '400': { $ref: '#/components/responses/Problem' }
  /api/auth/login:
    post:
      operationId: login
      summary: Đăng nhập và tạo phiên máy chủ
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginCommand' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/auth/me:
    get:
      operationId: getCurrentSession
      summary: Danh tính và phạm vi của phiên hiện tại
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/auth/change-password:
    post:
      operationId: changePassword
      summary: Đổi mật khẩu bắt buộc ở lần đăng nhập đầu tiên
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordCommand' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/auth/logout:
    post:
      operationId: logout
      summary: Hủy phiên hiện tại
      responses:
        '200': { description: Đã hủy session và hết hạn cookie phiên và CSRF }
        '401': { $ref: '#/components/responses/Problem' }
  /api/campaigns/current/status:
    get:
      operationId: getCurrentCampaignStatus
      summary: Đọc trạng thái readiness từ dữ liệu hiện hành
      responses:
        '200':
          description: Trạng thái chiến dịch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CampaignStatus' }
        '401': { $ref: '#/components/responses/Problem' }
  /api/scorecards/current:
    get:
      operationId: getCurrentScorecard
      summary: Đọc bảng điểm đã chuẩn hóa từ workbook nguồn
      responses:
        '200':
          description: Catalog bảng điểm và truy xuất nguồn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScorecardCatalog' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/assignments/current:
    get:
      operationId: getCurrentAssignments
      summary: Đọc bảng phân khối và thẩm định
      responses:
        '200': { $ref: '#/components/responses/AssignmentWorkbench' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/assignments/current/groups/{groupId}:
    put:
      operationId: saveGroupAssignment
      summary: Lưu phân công một hạng mục
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAssignmentCommand' }
      responses:
        '200': { $ref: '#/components/responses/AssignmentWorkbench' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/assignments/current/bulk:
    put:
      operationId: saveBulkAssignment
      summary: Áp dụng một phân công cho nhiều hạng mục
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkAssignmentCommand' }
      responses:
        '200': { $ref: '#/components/responses/AssignmentWorkbench' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/assignments/current/release:
    post:
      operationId: releaseAssignments
      summary: Ban hành snapshot phân công và mở tự chấm
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/AssignmentWorkbench' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/assignments/current/start-review:
    post:
      operationId: startRoundOne
      summary: Mở vòng thẩm định thứ nhất
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/AssignmentWorkbench' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/assignments/current/open-explanation:
    post:
      operationId: openExplanation
      summary: Khóa vòng 1 và mở thời gian giải trình
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/AssignmentWorkbench' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/assignments/current/start-round-two:
    post:
      operationId: startRoundTwo
      summary: Mở vòng thẩm định thứ hai
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/VersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/AssignmentWorkbench' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/unit/tasks:
    get:
      operationId: getUnitTasks
      summary: Đọc công việc theo tổ chức và khối của phiên
      responses:
        '200': { $ref: '#/components/responses/UnitTaskView' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/unit/results/final:
    get:
      operationId: getUnitFinalResult
      summary: Đọc kết quả cuối của đơn vị từ snapshot đã công bố
      responses:
        '200': { $ref: '#/components/responses/UnitFinalResult' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/unit/tasks/{lineId}/draft:
    put:
      operationId: saveUnitTaskDraft
      summary: Lưu bản nháp tự chấm
      parameters:
        - $ref: '#/components/parameters/LineId'
      requestBody: { $ref: '#/components/requestBodies/SaveTaskCommand' }
      responses:
        '200': { $ref: '#/components/responses/UnitTaskView' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/unit/tasks/{lineId}/submit:
    post:
      operationId: submitUnitTask
      summary: Gửi revision hồ sơ để thẩm định
      parameters:
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/SaveTaskCommand' }
      responses:
        '200': { $ref: '#/components/responses/UnitTaskView' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/unit/tasks/{lineId}/explanation:
    post:
      operationId: submitExplanation
      summary: Gửi revision giải trình cho dòng bị giảm điểm
      parameters:
        - $ref: '#/components/parameters/LineId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExplanationCommand' }
      responses:
        '200': { $ref: '#/components/responses/UnitTaskView' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/reviewer/queue:
    get:
      operationId: getReviewQueue
      summary: Đọc hàng chờ khớp Tổ và cán bộ của phiên
      responses:
        '200': { $ref: '#/components/responses/ReviewQueue' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/review-control:
    get:
      operationId: getReviewControl
      summary: Đọc projection điều hành tiến độ chấm theo tiêu chí và cán bộ
      responses:
        '200': { $ref: '#/components/responses/ReviewControl' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/admin/review-control/criteria/{groupId}/cases:
    get:
      operationId: getReviewControlCriterionCases
      summary: Đọc hồ sơ, minh chứng và lịch sử chấm của một tiêu chí để giám sát
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': { $ref: '#/components/responses/ReviewControlCriterionCases' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/reviewer/queue/{caseId}/round-one:
    post:
      operationId: completeRoundOne
      summary: Ghi quyết định thẩm định vòng 1
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReviewDecisionCommand' }
      responses:
        '200': { $ref: '#/components/responses/ReviewQueue' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/reviewer/queue/{caseId}/return:
    post:
      operationId: returnSubmissionToUnit
      summary: Trả hồ sơ vòng 1 cho đơn vị
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReturnSubmissionCommand' }
      responses:
        '200': { $ref: '#/components/responses/ReviewQueue' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/reviewer/queue/{caseId}/round-two:
    post:
      operationId: completeRoundTwo
      summary: Ghi quyết định thẩm định vòng 2
      parameters:
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReviewDecisionCommand' }
      responses:
        '200': { $ref: '#/components/responses/ReviewQueue' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/results/current:
    get:
      operationId: getCurrentResult
      summary: Đọc snapshot kết quả hiện hành
      responses:
        '200': { $ref: '#/components/responses/FinalResult' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/results/current/prepare:
    post:
      operationId: prepareFinalResult
      summary: Lập snapshot bất biến từ điểm vòng 1 và các dòng phải chấm lại ở vòng 2
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrepareResultCommand' }
      responses:
        '200': { $ref: '#/components/responses/FinalResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/results/current/approve:
    post:
      operationId: approveFinalResult
      summary: Người thứ hai duyệt snapshot
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResultVersionCommand' }
      responses:
        '200': { $ref: '#/components/responses/FinalResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/results/current/publish:
    post:
      operationId: publishFinalResult
      summary: Công bố snapshot đã được duyệt
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublishResultCommand' }
      responses:
        '200': { $ref: '#/components/responses/FinalResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/results/current/export:
    get:
      operationId: exportCurrentResult
      summary: Xuất Excel từ snapshot đang hiển thị
      responses:
        '200':
          description: Workbook tổng hợp, chi tiết và metadata
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/accounts:
    get:
      operationId: listAccounts
      summary: Danh sách tài khoản
      responses:
        '200':
          description: Tài khoản hiện hành
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createAccount
      summary: Tạo tài khoản và audit cùng giao dịch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccountCommand' }
      responses:
        '200':
          description: Tài khoản đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/organization-directory:
    get:
      operationId: getOrganizationDirectory
      summary: Đọc khối, đơn vị và tổ theo dõi
      responses:
        '200':
          description: Danh mục cơ cấu hiện hành
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationDirectory' }
        '403': { $ref: '#/components/responses/Problem' }
  /api/accounts/{accountId}/status:
    patch:
      operationId: setAccountStatus
      summary: Khóa hoặc mở khóa tài khoản và ghi audit cùng giao dịch
      parameters:
        - name: accountId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetAccountStatusCommand' }
      responses:
        '200':
          description: Trạng thái tài khoản đã cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/organization-directory/organizations:
    post:
      operationId: createOrganization
      summary: Tạo đơn vị và audit cùng giao dịch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrganizationCommand' }
      responses:
        '200':
          description: Đơn vị đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Organization' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
  /api/organization-directory/teams:
    post:
      operationId: createReviewTeam
      summary: Tạo tổ theo dõi và audit cùng giao dịch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReviewTeamCommand' }
      responses:
        '200':
          description: Tổ theo dõi đã tạo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewTeam' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  schemas:
    CampaignPhase:
      type: string
      enum: [PREPARATION, SELF_ASSESSMENT, ROUND_1, EXPLANATION, ROUND_2, FINAL_REVIEW, PUBLISHED, CLOSED]
    AccountRole:
      type: string
      enum: [SUPERADMIN, CAMPAIGN_ADMIN, REVIEWER, UNIT_MEMBER]
    EvidencePolicy:
      type: string
      enum: [LINK, DOCUMENT, INTERNAL, GUIDED]
    TaskStatus:
      type: string
      enum: [NOT_STARTED, DRAFT, SUBMITTED, RESUBMITTED, RETURNED, LOCKED]
    ResultStatus:
      type: string
      enum: [PENDING_APPROVAL, APPROVED, PUBLISHED]
    CsrfToken:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string }
    LoginCommand:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, maxLength: 120 }
        password: { type: string, format: password, maxLength: 72 }
    ChangePasswordCommand:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 15, maxLength: 72 }
    Session:
      type: object
      additionalProperties: false
      required: [id, displayName, role, campaignIds, capabilities, organizationId, teamId, passwordChangeRequired]
      properties:
        id: { type: string }
        displayName: { type: string }
        role: { $ref: '#/components/schemas/AccountRole' }
        campaignIds:
          type: array
          items: { type: string }
        capabilities:
          type: array
          items: { type: string }
        organizationId: { type: [string, 'null'] }
        teamId: { type: [string, 'null'] }
        passwordChangeRequired: { type: boolean }
    ReadinessItem:
      type: object
      additionalProperties: false
      required: [code, label, ready, detail]
      properties:
        code: { type: string }
        label: { type: string }
        ready: { type: boolean }
        detail: { type: string }
    CampaignStatus:
      type: object
      additionalProperties: false
      required: [id, name, phase, version, scorecardStatus, scorecardGroups, scorecardLines, documentedUnitGroups, documentedUnits, activeAccounts, submissions, reviewCases, finalResults, readiness]
      properties:
        id: { type: string }
        name: { type: string }
        phase: { $ref: '#/components/schemas/CampaignPhase' }
        version: { type: integer }
        scorecardStatus: { type: string }
        scorecardGroups: { type: integer }
        scorecardLines: { type: integer }
        documentedUnitGroups: { type: integer }
        documentedUnits: { type: integer }
        activeAccounts: { type: integer }
        submissions: { type: integer }
        reviewCases: { type: integer }
        finalResults: { type: integer }
        readiness:
          type: array
          items: { $ref: '#/components/schemas/ReadinessItem' }
    ScorecardSource:
      type: object
      additionalProperties: false
      required: [fileName, sha256, receivedScope, importedAt]
      properties:
        fileName: { type: string }
        sha256: { type: string }
        receivedScope: { type: string }
        importedAt: { type: string, format: date-time }
    ScorecardPolicy:
      type: object
      additionalProperties: false
      required: [coreMaximum, bonusRawMaximum, bonusCap, overallMaximum, groupCount, lineCount]
      properties:
        coreMaximum: { type: number }
        bonusRawMaximum: { type: number }
        bonusCap: { type: number }
        overallMaximum: { type: number }
        groupCount: { type: integer }
        lineCount: { type: integer }
    ScorecardUnitGroup:
      type: object
      additionalProperties: false
      required: [code, name, documentedUnitCount, sourceReference]
      properties:
        code: { type: string }
        name: { type: string }
        documentedUnitCount: { type: integer }
        sourceReference: { type: string }
    ScorecardLine:
      type: object
      additionalProperties: false
      required: [id, code, title, requirement, evidenceHint, reportTemplate, evidencePolicy, maximumScore, sourceSheet, sourceRow, displayOrder]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        requirement: { type: string }
        evidenceHint: { type: string }
        reportTemplate: { type: string }
        evidencePolicy: { $ref: '#/components/schemas/EvidencePolicy' }
        maximumScore: { type: number }
        sourceSheet: { type: string }
        sourceRow: { type: integer }
        displayOrder: { type: integer }
    ScorecardGroup:
      type: object
      additionalProperties: false
      required: [id, code, title, section, displayOrder, lines]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        section: { type: string, enum: [CORE, BONUS] }
        displayOrder: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ScorecardLine' }
    ScorecardCatalog:
      type: object
      additionalProperties: false
      required: [id, campaignId, campaignName, title, audience, status, source, policy, unitGroups, groups]
      properties:
        id: { type: string }
        campaignId: { type: string }
        campaignName: { type: string }
        title: { type: string }
        audience: { type: string }
        status: { type: string }
        source: { $ref: '#/components/schemas/ScorecardSource' }
        policy: { $ref: '#/components/schemas/ScorecardPolicy' }
        unitGroups:
          type: array
          items: { $ref: '#/components/schemas/ScorecardUnitGroup' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/ScorecardGroup' }
    AssignmentUnitGroup:
      type: object
      additionalProperties: false
      required: [code, name, documentedUnitCount]
      properties:
        code: { type: string }
        name: { type: string }
        documentedUnitCount: { type: integer }
    AssignmentTeam:
      type: object
      additionalProperties: false
      required: [id, name, monitorId, monitorName, availableAssessorCount, lockedAssessorCount]
      properties:
        id: { type: string }
        name: { type: string }
        monitorId: { type: [string, 'null'] }
        monitorName: { type: [string, 'null'] }
        availableAssessorCount: { type: integer, minimum: 0 }
        lockedAssessorCount: { type: integer, minimum: 0 }
    AssignmentReviewer:
      type: object
      additionalProperties: false
      required: [id, displayName, teamId, enabled, teamMonitor]
      properties:
        id: { type: string }
        displayName: { type: string }
        teamId: { type: string }
        enabled: { type: boolean }
        teamMonitor: { type: boolean }
    AssignmentPlan:
      type: object
      additionalProperties: false
      required: [groupId, unitGroupCodes, teamId, reviewerId, version, expectedTasks, submittedTasks, reviewedTasks, lastReviewedBy, lastReviewedAt]
